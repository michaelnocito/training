<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>JSON for Field Mappers</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f7fb;--card:#fff;--tx:#1d2330;--mu:#6b7385;--pr:#2563eb;--ok:#16a34a;--bad:#dc2626;--bd:#e3e6ef;--code:#eef0f7}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12141c;--card:#1c2030;--tx:#e8eaf2;--mu:#98a0b5;--bd:#2b3046;--code:#262b40}}
:root[data-theme="dark"]{--bg:#12141c;--card:#1c2030;--tx:#e8eaf2;--mu:#98a0b5;--bd:#2b3046;--code:#262b40}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
#app{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:0}h2{font-size:19px;margin:0 0 8px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.xp{background:var(--pr);color:#fff;border-radius:99px;padding:4px 12px;font-weight:700;font-size:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin:10px 0}
.tk{border-left:5px solid var(--pr)}
.day{font-size:12px;font-weight:700;color:var(--pr);text-transform:uppercase;letter-spacing:.06em;margin-top:18px}
.les{display:flex;gap:12px;align-items:center;cursor:pointer}
.dot{width:34px;height:34px;border-radius:50%;background:var(--code);display:grid;place-items:center;font-weight:700;flex:none}
.done .dot{background:var(--ok);color:#fff}
.mu{color:var(--mu);font-size:14px}
.bar{height:8px;background:var(--code);border-radius:9px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:var(--pr);transition:width .3s}
button{font:inherit;font-weight:700;border:0;border-radius:12px;padding:12px 16px;background:var(--pr);color:#fff;cursor:pointer;width:100%;margin-top:10px}
button.g{background:var(--code);color:var(--tx)}
.opt{display:block;width:100%;text-align:left;background:var(--card);color:var(--tx);border:2px solid var(--bd);margin-top:8px;font-weight:500}
.opt.ok{border-color:var(--ok);background:rgba(22,163,74,.12)}.opt.no{border-color:var(--bad);background:rgba(220,38,38,.12)}
pre,code{background:var(--code);border-radius:8px;font-family:ui-monospace,Menlo,monospace;font-size:13px}
code{padding:1px 5px}pre{padding:10px;overflow-x:auto;margin:8px 0}
table{border-collapse:collapse;width:100%;font-size:14px}td{border-bottom:1px solid var(--bd);padding:6px 4px;vertical-align:top}
.say{margin-top:10px;padding:10px;border-left:4px solid var(--ok);background:var(--code);border-radius:0 10px 10px 0;font-size:15px}
.fb{margin-top:10px;padding:10px;border-radius:10px;background:var(--code);font-size:15px}
.fc{min-height:130px;display:grid;place-items:center;text-align:center;cursor:pointer}
.back{background:none;color:var(--mu);width:auto;padding:4px 0;margin:0}
</style></head><body><div id="app"></div>
<script>
const TITLE="JSON for Field Mappers",SUB="You already know field mapping, so we'll start from there. Learn the basics in four lessons, then work real tickets where JSON is the problem.",KEY="jsonC";
const T=(h,b)=>[`🎫 `+h,b,1];
const L=[
{d:"Foundations",t:"JSON in field-mapping terms",s:[
[`A field is a name plus a value`,`In mapping, every field has a column name and a cell value. JSON is exactly that, written as text:<pre>"firstName": "Dana"</pre>The left side is the <b>key</b> (the column header). The right side is the <b>value</b> (the cell).`],
[`Object = one record`,`Curly braces hold one record, like one spreadsheet row:<pre>{\n "firstName": "Dana",\n "phone": "856-555-0142"\n}</pre>Pairs are <code>"key": value</code>, separated by commas.`],
[`Array = a list of records`,`Square brackets hold a list, like the whole table:<pre>[\n {"firstName":"Dana"},\n {"firstName":"Luis"}\n]</pre>APIs often return an array of objects when you ask for many records.`],
[`Why not just CSV?`,`CSV is flat: one row, fixed columns. JSON can <b>nest</b>: a customer can contain a vehicle, which contains a make and year. That nesting is why mapping tools need paths, which we cover in lesson 3.`],
{q:`In field-mapping terms, a JSON object is most like…`,o:[`One record (a row)`,`A whole database`,`A single cell`,`A column header`],a:0,e:`An object is one record. The array is the list of them.`},
{q:`<code>[ {...}, {...}, {...} ]</code> contains how many records?`,o:[`1`,`2`,`3`,`Can't tell`],a:2,e:`An array of three objects is three records.`},
{q:`In <code>"phone": "856-555-0142"</code>, <code>"phone"</code> is the…`,o:[`Value`,`Key`,`Array`,`Record`],a:1,e:`Key = the field name. Value = the data.`}]},
{d:"Foundations",t:"Data types",s:[
[`Six types`,`<table><tr><td><b>string</b></td><td>Text in double quotes: <code>"Dana"</code></td></tr><tr><td><b>number</b></td><td>No quotes: <code>2022</code>, <code>19.99</code></td></tr><tr><td><b>boolean</b></td><td><code>true</code> or <code>false</code>, lowercase, no quotes</td></tr><tr><td><b>null</b></td><td>Explicitly "no value"</td></tr><tr><td><b>object</b></td><td><code>{ ... }</code></td></tr><tr><td><b>array</b></td><td><code>[ ... ]</code></td></tr></table>`],
[`Quotes change the meaning`,`<code>"year": 2022</code> is a number. <code>"year": "2022"</code> is text. Many destinations reject the wrong one. The rule of thumb: if you won't do math on it, make it a <b>string</b>: phone numbers, ZIP codes, VINs, IDs. A ZIP stored as a number loses its leading zero (<code>08028</code> becomes <code>8028</code>).`],
[`Three kinds of "nothing"`,`<pre>"email": null      // no value\n"email": ""        // empty text\n(email omitted)    // not mentioned at all</pre>These can behave differently. Sending an empty value can <i>erase</i> existing data, while leaving the field out may leave it untouched.`],
{q:`Which is a number?`,o:[`<code>"year": "2022"</code>`,`<code>"year": 2022</code>`,`<code>"year": '2022'</code>`,`<code>"year": two</code>`],a:1,e:`Numbers have no quotes.`},
{q:`How should a ZIP code like 08028 be stored?`,o:[`Number`,`String`,`Boolean`,`Null`],a:1,e:`Strings preserve leading zeros.`},
{q:`Sending <code>"email": ""</code> in an update may…`,o:[`Do nothing`,`Overwrite an existing email with blank`,`Delete the record`,`Add a second email`],a:1,e:`Empty values can overwrite data. Test before assuming.`}]},
{d:"Foundations",t:"Nesting and paths",s:[
[`Objects inside objects`,`<pre>{\n "firstName":"Dana",\n "vehicle":{\n  "make":"Honda",\n  "model":"CR-V"\n }\n}</pre>The model lives at <b>vehicle → model</b>. Most tools write that path with a dot: <code>vehicle.model</code>.`],
[`Arrays and index numbers`,`<pre>"phones":[\n {"type":"home","number":"555-0100"},\n {"type":"mobile","number":"555-0142"}\n]</pre>Counting starts at <b>0</b>. The first phone is <code>phones[0].number</code>, the second is <code>phones[1].number</code>.`],
[`Flattening for the destination`,`Your destination probably has flat fields. Mapping flattens them:<table><tr><td><code>firstName</code></td><td>→ First Name</td></tr><tr><td><code>vehicle.model</code></td><td>→ Vehicle Interest</td></tr><tr><td><code>phones[1].number</code></td><td>→ Mobile</td></tr></table>Exact path syntax varies by tool. Check its documentation.`],
{q:`Path to the make in the example above?`,o:[`<code>make</code>`,`<code>vehicle.make</code>`,`<code>vehicle[make]</code>`,`<code>make.vehicle</code>`],a:1,e:`Follow the nesting from outside in.`},
{q:`Which index is the first item in an array?`,o:[`1`,`0`,`-1`,`first`],a:1,e:`Arrays are zero-indexed.`},
{q:`A customer has 2 phones but the destination has one Phone field. What do you ask first?`,o:[`Delete one`,`Which one should be the primary?`,`Nothing, use the first`,`Change the API`],a:1,e:`Mapping many-to-one needs a business rule.`}]},
{d:"Foundations",t:"Syntax rules and typos",s:[
[`The five rules`,`1) Keys use <b>double quotes</b>. 2) Strings use <b>double quotes</b>. 3) Commas <b>between</b> items, never after the last. 4) Every <code>{</code> <code>[</code> needs its closing match. 5) <b>No comments.</b> Also, keys are case-sensitive: <code>firstName</code> and <code>FirstName</code> differ.`],
[`What really breaks files`,`Trailing commas after the last item. Single quotes. Smart quotes (“ ”) pasted from Word, Slack, or Excel. A missing comma between fields. A quote inside text without escaping (use <code>\\"</code>). Extra text before or after the braces.`],
[`Your safety net`,`Paste suspect JSON into a validator/formatter or open it in an editor like VS Code. They point to the exact line. Always validate after hand-editing a mapping file.`],
{q:`What's wrong?<pre>{"name":"Dana","age":34,}</pre>`,o:[`Missing quotes on 34`,`Trailing comma`,`Wrong brackets`,`Nothing`],a:1,e:`A comma after the last item is invalid.`},
{q:`What's wrong?<pre>{'name':'Dana'}</pre>`,o:[`Single quotes`,`Missing comma`,`Extra brace`,`Nothing`],a:0,e:`JSON requires double quotes.`},
{q:`Best way to find a syntax error fast?`,o:[`Read it twice`,`Paste it into a validator`,`Resend it`,`Rewrite from scratch`],a:1,e:`Validators point to the line and column.`}]},
{d:"Tickets",t:"Ticket 1: Parse error",s:[
T(`Sync fails right after a mapping edit`,`A teammate hand-edited the mapping file. Now:<pre>HTTP/1.1 400 Bad Request\n{"error":"Unexpected token } at position 112"}</pre><pre>{\n \"mappings\":[\n  {\"source\":\"cell\",\"target\":\"phone\"},\n  {\"source\":\"email\",\"target\":\"email\"},\n ]\n}</pre>`),
{q:`What does a 400 with "unexpected token" tell you?`,o:[`Auth failure`,`The JSON is malformed`,`Server crash`,`Rate limit`],a:1,e:`400 = bad request. Here the JSON itself can't be parsed.`},
{q:`What's the cause?`,o:[`Wrong key`,`Trailing comma after the last mapping`,`Missing quotes`,`Nesting`],a:1,e:`The comma after the final object is invalid JSON.`},
{q:`Best prevention?`,o:[`Never edit mappings`,`Validate the file before saving or deploying`,`Add comments`,`Use single quotes`],a:1,e:`Make validation part of every hand-edit.`},
[`Say it in the interview`,`"A 400 with a position number pointed to malformed JSON. I validated the file, found a trailing comma, and now I validate before every deploy."`]]},
{d:"Tickets",t:"Ticket 2: Wrong data type",s:[
T(`Vehicles rejected, and ZIPs look wrong`,`<pre>HTTP/1.1 422 Unprocessable Entity\n{"error":"vehicle.year must be a number"}</pre>Payload:<pre>{"vehicle":{"year":"2022"},\n "zip":8028}</pre>Dealer also says: "Some ZIP codes lost their leading zero."`),
{q:`Why the 422?`,o:[`Missing field`,`<code>year</code> is text; destination wants a number`,`Bad key`,`Server down`],a:1,e:`Valid JSON but wrong type for that field.`},
{q:`Where do you fix the ZIP issue?`,o:[`Ignore it`,`Treat ZIP as a string at the source/import and mapping`,`Convert to boolean`,`Delete them`],a:1,e:`Leading zeros disappear when ZIPs are stored as numbers, often via Excel. Keep them text.`},
{q:`After fixing, how do you check?`,o:[`Assume`,`Test records, including a ZIP that starts with 0, and verify in the destination`,`Ask the dealer`,`Clear the cache`],a:1,e:`Test the edge case, not just the easy one.`},
[`Say it in the interview`,`"A 422 on a valid payload means a validation rule. The year was text, so I converted the type, and I kept ZIPs as strings so leading zeros survive."`]]},
{d:"Tickets",t:"Ticket 3: Emails vanished",s:[
T(`Customers lost their email addresses`,`After a nightly update, many customers have blank emails. The update payload:<pre>PATCH /customers/310\n{"phone":"856-555-0142",\n "email":""}</pre>The source system has no email for that customer, but the destination did.`),
{q:`What likely happened?`,o:[`The key expired`,`The empty string overwrote the existing email`,`Pagination`,`Rate limit`],a:1,e:`The source's blank value was sent and replaced real data.`},
{q:`Best fix?`,o:[`Send nulls instead`,`Omit blank fields from updates (or follow the API's documented rule for clearing)`,`Send more fields`,`Stop syncing`],a:1,e:`Only send fields that have values, unless the API says null clears them.`},
{q:`Recovery step?`,o:[`Nothing`,`Restore emails from backup or the other system, and verify counts`,`Ask customers`,`Delete records`],a:1,e:`Recover from a trusted source, then reconcile.`},
[`Say it in the interview`,`"Blank source values overwrote good data. I changed the mapping to skip empty fields, restored from backup, and reconciled before closing."`]]},
{d:"Tickets",t:"Ticket 4: Wrong phone type",s:[
T(`Mobile numbers landing in the Home field`,`Payload:<pre>"phones":[\n {"type":"home","number":"555-0100"},\n {"type":"mobile","number":"555-0142"}\n]</pre>Mapping: <code>phones[0].number → mobile</code>. Some customers only have one phone, and some have none.`),
{q:`Why is the wrong number in Mobile?`,o:[`Typo`,`The mapping uses position, and order isn't guaranteed`,`Auth`,`Case sensitivity`],a:1,e:`Index-based paths break when order changes.`},
{q:`Better approach?`,o:[`Use <code>phones[1]</code>`,`Select the phone where <code>type</code> is "mobile"`,`Use the last one`,`Skip phones`],a:1,e:`Choose by a stable attribute, not position.`},
{q:`Edge case to test?`,o:[`Customers with one phone, or none (empty array)`,`Only perfect records`,`Uppercase names`,`Long names`],a:0,e:`Missing items cause errors or blanks. Test the empties.`},
[`Say it in the interview`,`"I'd avoid position-based paths for arrays and select by type, then test one-phone and zero-phone customers."`]]},
{d:"Interview",t:"Rapid-fire flashcards",fc:[
[`JSON vs CSV?`,`CSV is flat rows and columns. JSON is key-value pairs that can nest objects and arrays.`],
[`JSON vs XML?`,`Both structure data. JSON is lighter and more common in modern APIs. XML uses tags and is older.`],
[`Is this valid? {"a":1,}`,`No. A trailing comma is invalid.`],
[`Keys case-sensitive?`,`Yes. firstName and FirstName are different keys.`],
[`null vs "" vs missing?`,`No value, empty text, and not sent. They can behave differently, especially on updates.`],
[`What is a schema?`,`A definition of expected fields, types, and required values, used to validate JSON.`],
[`How do you validate JSON?`,`Paste it into a validator/formatter or an editor like VS Code. Fix the flagged line.`],
[`Date format gotcha?`,`Destinations often want ISO format, like 2026-10-04. A value like 10/04/2026 can fail or be misread.`],
[`Question: how comfortable are you with JSON?`,`Honest answer: strong reading and mapping skills; I validate edits, watch types and nulls, and trace one record when something breaks.`],
[`Ask them`,`What do your mapping files look like? What JSON issues come up most in dealer setups? How do you validate changes before they go live?`]]}
];
let S={xp:0,done:{}};try{S=JSON.parse(localStorage.getItem(KEY))||S}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const $=document.getElementById("app"),nq=l=>l.s.filter(x=>!Array.isArray(x)).length;
function home(){let h=`<div class=top><h1>${TITLE}</h1><span class=xp>⚡ ${S.xp} XP</span></div><div class=mu>${SUB}</div>`;
const n=Object.keys(S.done).length;h+=`<div class=bar><i style="width:${n/L.length*100}%"></i></div><div class=mu>${n} of ${L.length} complete</div>`;
let last="";L.forEach((l,i)=>{if(l.d!=last){h+=`<div class=day>${l.d}</div>`;last=l.d}
h+=`<div class="card les ${S.done[i]!=null?"done":""}" onclick="start(${i})"><div class=dot>${S.done[i]!=null?"✓":i+1}</div><div><b>${l.t}</b><div class=mu>${l.fc?l.fc.length+" flashcards":nq(l)+" questions"}${S.done[i]!=null?" · best "+S.done[i]+"%":""}</div></div></div>`});
h+=`<button class=g onclick="if(confirm('Reset progress?')){S={xp:0,done:{}};save();home()}">Reset progress</button>`;$.innerHTML=h}
let cur,step,score,ans;
function start(i){cur=i;step=0;score=0;ans=false;card()}
function card(){const l=L[cur];if(l.fc)return fc(0);if(step>=l.s.length)return fin();
const c=l.s[step],bar=`<button class=back onclick="home()">← Back</button><div class=bar><i style="width:${step/l.s.length*100}%"></i></div>`;
if(Array.isArray(c)){const last=step==l.s.length-1;
$.innerHTML=bar+`<div class="card ${c[2]?"tk":""}"><h2>${c[0]}</h2>${last?`<div class=say>${c[1]}</div>`:c[1]}</div><button onclick="step++;card()">${last?"Finish":"Continue"}</button>`;return}
ans=false;$.innerHTML=bar+`<div class=card><div class=mu>Your call</div><h2>${c.q}</h2>${c.o.map((o,k)=>`<button class=opt onclick="pick(${k},this)">${o}</button>`).join("")}<div id=fb></div></div>`}
function pick(k,el){if(ans)return;ans=true;const q=L[cur].s[step];
const ok=k==q.a;if(ok){score++;S.xp+=10}el.classList.add(ok?"ok":"no");
if(!ok)document.querySelectorAll(".opt")[q.a].classList.add("ok");
document.getElementById("fb").innerHTML=`<div class=fb>${ok?"✅ Correct! +10 XP":"❌ Not quite."} ${q.e}</div><button onclick="step++;card()">Next</button>`;save()}
function fin(){const l=L[cur],t=nq(l),p=Math.round(score/t*100);S.done[cur]=Math.max(S.done[cur]||0,p);S.xp+=20;save();
$.innerHTML=`<div class=card style="text-align:center"><h1>${p==100?"🏆":"🎉"} Complete</h1><p>You got ${score}/${t} right (${p}%). +20 XP bonus.</p>${p<100?`<p class=mu>Retry it and explain each answer aloud.</p>`:""}</div><button onclick="start(${cur})" class=g>Retry</button><button onclick="home()">Back to course</button>`}
function fc(i,flip){const l=L[cur],c=l.fc[i];if(i>=l.fc.length){S.done[cur]=100;S.xp+=30;save();return $.innerHTML=`<div class=card style="text-align:center"><h1>🏆 Course finished</h1><p>Open a real JSON file (a mapping or an API response) and trace one field from source to destination out loud.</p></div><button onclick="home()">Back to course</button>`}
$.innerHTML=`<button class=back onclick="home()">← Back</button><div class=bar><i style="width:${i/l.fc.length*100}%"></i></div><div class="card fc" onclick="fc(${i},${!flip})">${flip?`<div>${c[1]}</div>`:`<h2>${c[0]}</h2>`}</div><div class=mu style="text-align:center">${flip?"Did you answer first?":"Answer aloud, then tap to reveal."} Card ${i+1}/${l.fc.length}</div><button onclick="fc(${i+1})">${flip?"Next card":"Skip"}</button>`}
home();
</script></body></html>
